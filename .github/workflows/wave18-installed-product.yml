          New-Item -ItemType Directory -Force -Path (Join-Path $out 'raw') | Out-Null
          $path = Join-Path $out 'raw/py312-projection.timing.json'
          $timing = if (Test-Path -LiteralPath $path -PathType Leaf) { Get-Content -LiteralPath $path -Raw | ConvertFrom-Json } else { [ordered]@{node='test_current_accepts_exact_retained_projection_inventory'; started_utc=$null} }
          $timing.finished_utc = [DateTimeOffset]::UtcNow.ToString('o')
