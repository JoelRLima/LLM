name: WAVE 18 Installed Product

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: "normal preserves W18; r01/r02 run existing diagnostics; focused runs short identity/finalizer/graph gates only"
        type: choice
        options: [normal, r01, r02, focused]
        default: normal
        required: true
      diagnostic_unit_tests:
        description: "Owner opt-in: run the new deterministic diagnostic regressions before the selected probe"
        type: boolean
        default: false
      diagnostic_revision:
        description: "Reviewed implementation commit SHA; mandatory for r01/r02/focused"
        type: string
        default: ""
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode != '' && inputs.diagnostic_mode != 'normal' && format('-diagnostic-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  installed-product:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_mode == '' || inputs.diagnostic_mode == 'normal' }}
    name: Windows x64 installed product
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install build and verification dependencies
        shell: pwsh
        run: |
          python -m pip install --isolated --no-input --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: --no-deps --requirement distribution/bootstrap-pip.lock
          python -m pip install --isolated --no-input --disable-pip-version-check --no-cache-dir --only-binary=:all: --requirement requirements-ci.lock

          $setuptoolsVersion = (python -c "import setuptools, setuptools.build_meta; print(setuptools.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $setuptoolsVersion -ne "81.0.0") {
            throw "W18 host bootstrap did not provide setuptools==81.0.0 with setuptools.build_meta: $setuptoolsVersion"
          }
          Write-Host "W18 host bootstrap: setuptools $setuptoolsVersion with setuptools.build_meta available"

      - name: Authenticate W23 source before installed lifecycle
        run: python -B scripts/w23_ci_identity.py before

      - name: Assert clean W18 host before product lifecycle
        shell: pwsh
        run: |
          $distributionProbe = @'
          import importlib.metadata as metadata

          try:
              version = metadata.version('local-llm-agent')
          except metadata.PackageNotFoundError:
              print('W18 host distribution check: local-llm-agent absent')
          else:
              raise SystemExit(
                  f'host contamination: local-llm-agent {version} is installed in the host interpreter'
              )
          '@
          python -c $distributionProbe
          if ($LASTEXITCODE -ne 0) {
            throw "W18 host distribution cleanliness check failed"
          }

          $launchers = @(Get-Command -Name "llm-agent" -CommandType Application -ErrorAction SilentlyContinue)
          if ($launchers.Count -ne 0) {
            $locations = ($launchers | ForEach-Object { $_.Source }) -join "; "
            throw "host contamination: llm-agent resolves in the host PATH: $locations"
          }
          Write-Host "W18 host PATH check: llm-agent absent"

      - name: Build isolated W18 release candidate and bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "w18-release"
          $artifact = Join-Path $env:RUNNER_TEMP "cpython-3.12.14+20260901-x86_64-pc-windows-msvc-install_only.tar.gz"
          $uv = Join-Path $env:RUNNER_TEMP "uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14+20260901-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile $artifact
          if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne "e90c1b6419da3bd812dd73bb3de40287a21abf153438147639ec5e20375ea93f") { throw "CPython artifact SHA-256 mismatch" }
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/0.12.13/uv-x86_64-pc-windows-msvc.zip" -OutFile $uv
          if ((Get-FileHash -LiteralPath $uv -Algorithm SHA256).Hash.ToLowerInvariant() -ne "a86c9dc7bad9b03f388583b7187c05fe9951c2e0d392217e8fd43d97787f6ec2") { throw "uv artifact SHA-256 mismatch" }
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w18_build -ChildArguments @("scripts/build_release_artifacts.py", "--output-dir", $output, "--python", (Get-Command python).Source, "--python-artifact", $artifact, "--uv-artifact", $uv)

      - name: Run W18 architecture checker
        shell: pwsh
        run: python scripts/check_wave18_architecture.py

      - name: Verify W18 installed product lifecycle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "w18-release\bundle"
          $summary = Join-Path $env:RUNNER_TEMP "w18-installed-product.json"
          $w17 = Join-Path $env:RUNNER_TEMP "w18-w17-installed-interactive.json"
          $matrix = Join-Path $env:RUNNER_TEMP "w18-conpty-layer-matrix.json"
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w18_lifecycle -ChildArguments @("scripts/verify_installed_product.py", "--bundle-dir", $bundle, "--summary-json", $summary, "--w17-summary-json", $w17, "--conpty-layer-matrix-json", $matrix)

      - name: Build W18 ConPTY authority evidence
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP "w18-installed-product.json"
          $w17 = Join-Path $env:RUNNER_TEMP "w18-w17-installed-interactive.json"
          $matrix = Join-Path $env:RUNNER_TEMP "w18-conpty-layer-matrix.json"
          $authority = Join-Path $env:RUNNER_TEMP "w18-conpty-authority-evidence.json"
          python scripts/build_conpty_authority_evidence.py --installed-product-summary $summary --installed-interactive $w17 --layer-matrix $matrix --output $authority

      - name: Run permanent W18 adversarial campaign with lifecycle evidence
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "w18-adversarial.json"
          $release = Join-Path $env:RUNNER_TEMP "w18-release"
          $summary = Join-Path $env:RUNNER_TEMP "w18-installed-product.json"
          $uv = Join-Path $release "uv-build-evidence.json"
          $authority = Join-Path $env:RUNNER_TEMP "w18-conpty-authority-evidence.json"
          $w17 = Join-Path $env:RUNNER_TEMP "w18-w17-installed-interactive.json"
          $matrix = Join-Path $env:RUNNER_TEMP "w18-conpty-layer-matrix.json"
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w18_adversarial -ChildArguments @("scripts/run_wave18_adversarial.py", "--installed-evidence", $summary, "--uv-build-evidence", $uv, "--conpty-authority-evidence", $authority, "--installed-interactive-evidence", $w17, "--conpty-layer-matrix", $matrix, "--json", $output)

      - name: Verify bounded W18 evidence before upload
        id: verify_bounded_evidence
        if: always()
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "w18-release"
          $files = @(
            (Join-Path $release "uv-build-evidence.json")
            (Join-Path $env:RUNNER_TEMP "w18-installed-product.json")
            (Join-Path $env:RUNNER_TEMP "w18-w17-installed-interactive.json")
            (Join-Path $env:RUNNER_TEMP "w18-conpty-layer-matrix.json")
            (Join-Path $env:RUNNER_TEMP "w18-conpty-authority-evidence.json")
            (Join-Path $env:RUNNER_TEMP "w18-adversarial.json")
          )
          $safetyArgs = @()
          foreach ($file in $files) {
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              $safetyArgs += @("--file", $file)
            }
          }
          if ($safetyArgs.Count -eq 0) {
            throw "no bounded W18 evidence JSON was produced"
          }
          python scripts/check_w18_artifact_safety.py @safetyArgs

      - name: Upload W18 local evidence
        if: always() && steps.verify_bounded_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wave18-installed-product-evidence
          path: |
            ${{ runner.temp }}/w18-release/uv-build-evidence.json
            ${{ runner.temp }}/w18-adversarial.json
            ${{ runner.temp }}/w18-installed-product.json
            ${{ runner.temp }}/w18-w17-installed-interactive.json
            ${{ runner.temp }}/w18-conpty-layer-matrix.json
            ${{ runner.temp }}/w18-conpty-authority-evidence.json
          if-no-files-found: warn

      - name: Remove runner-local RAW ConPTY capture
        if: always()
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP "w18-conpty-layer-matrix.raw.json"
          Remove-Item -LiteralPath $raw -Force -ErrorAction SilentlyContinue

      - name: Verify tracked source after W18
        if: always()
        run: python -B scripts/w23_ci_identity.py after

      - name: Preserve bounded W18 process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w23-w18-bounded-process-evidence
          path: ${{ runner.temp }}/w23-evidence/
          if-no-files-found: error

  manual-diagnostic:
    name: Manual W23 diagnostic (${{ inputs.diagnostic_mode }})
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.diagnostic_mode == 'r01' || inputs.diagnostic_mode == 'r02') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      W23_DIAG_MODE: ${{ inputs.diagnostic_mode }}
      W23_RUN_DIAGNOSTIC_TESTS: ${{ inputs.diagnostic_unit_tests }}
      W23_EXPECTED_TOOLING_SHA: ${{ inputs.diagnostic_revision }}
    steps:
      - name: Require the explicitly reviewed workflow revision
        shell: pwsh
        run: |
          if ($env:W23_EXPECTED_TOOLING_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Supply diagnostic_revision as the reviewed 40-character commit SHA' }
          if ($env:W23_EXPECTED_TOOLING_SHA -cne $env:GITHUB_SHA) { throw 'Selected branch moved or does not match the reviewed diagnostic revision' }

      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: ${{ inputs.diagnostic_mode == 'r02' && '3.10.11' || '3.12.10' }}
          architecture: x64

      - name: Initialize UNKNOWN evidence in a new protected profile root
        timeout-minutes: 1
        working-directory: tooling
        shell: pwsh
        run: ./scripts/w23_diagnostics/secure-work.ps1

      - name: Execute only the selected focal diagnostic
        id: execute
        timeout-minutes: 32
        working-directory: tooling
        shell: pwsh
        run: |
          python -B -u -m scripts.w23_diagnostics run --work $env:W23_DIAG_WORK --mode $env:W23_DIAG_MODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Finalize bounded public evidence even after failure
        id: finalize
        if: always()
        timeout-minutes: 2
        shell: pwsh
        env:
          W23_RUN_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-RealDirectory([string]$path) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not [IO.Path]::IsPathRooted($path)) { throw 'Expected an absolute directory' }
            $item = Get-Item -LiteralPath $path -Force
            if (-not $item.PSIsContainer) { throw 'Expected a directory' }
            while ($null -ne $item) {
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse path rejected' }
              $item = $item.Parent
            }
          }
          function Confirm-Export([string]$path) {
            Assert-RealDirectory $path
            $pending = [Collections.Generic.Stack[string]]::new()
            $pending.Push($path)
            $files = @{}
            $total = 0L
            while ($pending.Count) {
              foreach ($item in Get-ChildItem -LiteralPath $pending.Pop() -Force) {
                if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse evidence rejected' }
                if ($item.PSIsContainer) { $pending.Push($item.FullName); continue }
                if ($item.Length -gt 4MB -or $item.Extension -notin @('.json','.jsonl','.log','.txt')) { throw 'Invalid evidence member' }
                $name = $item.FullName.Substring($path.Length + 1).Replace('\','/')
                $files[$name] = $item.FullName
                $total += $item.Length
                if ($files.Count -gt 257 -or $total -gt 128MB) { throw 'Evidence limit exceeded' }
              }
            }
            if (-not $files.ContainsKey('summary.json') -or -not $files.ContainsKey('SHA256.json')) { throw 'Incomplete export' }
            $hashes = Get-Content -LiteralPath $files['SHA256.json'] -Raw | ConvertFrom-Json
            $names = @($hashes.PSObject.Properties.Name)
            if ($names.Count -ne $files.Count - 1) { throw 'Incomplete checksum inventory' }
            foreach ($name in $files.Keys) {
              if ($name -ceq 'SHA256.json') { continue }
              if ($names -cnotcontains $name -or $hashes.$name -isnot [string] -or $hashes.$name -cnotmatch '^[a-f0-9]{64}$' -or (Get-FileHash -LiteralPath $files[$name] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hashes.$name) { throw 'Checksum mismatch' }
            }
            $summary = Get-Content -LiteralPath $files['summary.json'] -Raw | ConvertFrom-Json
            if ($summary.status -notin @('PASS','FAIL','TIMEOUT','UNKNOWN')) { throw 'Invalid terminal status' }
            if ($summary.status -eq 'PASS' -and ($summary.completed -isnot [bool] -or $summary.completed -ne $true -or $env:W23_RUN_OUTCOME -ne 'success')) { throw 'Unproven success' }
            return $summary
          }
          $upload = $null
          $exportCode = 1
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:W23_DIAG_WORK)) {
              $expected = Join-Path $env:LOCALAPPDATA ("w23-manual-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
              if ([IO.Path]::GetFullPath($env:W23_DIAG_WORK) -ine $expected) { throw 'Unexpected work root' }
              Assert-RealDirectory $expected
              $candidate = Join-Path $expected 'upload'
              if (Test-Path -LiteralPath $candidate) { throw 'Refusing to reuse export' }
              $tooling = Join-Path $env:GITHUB_WORKSPACE 'tooling'
              if (-not (Test-Path -LiteralPath (Join-Path $tooling 'scripts/w23_diagnostics/entry.py') -PathType Leaf)) { throw 'Exporter unavailable' }
              Push-Location -LiteralPath $tooling
              try {
                python -B -m scripts.w23_diagnostics export --work $expected --mode $env:W23_DIAG_MODE --run-outcome $env:W23_RUN_OUTCOME
                $exportCode = $LASTEXITCODE
              } finally { Pop-Location }
              if ($exportCode -notin @(0,1)) { throw 'Exporter did not finish' }
              $final = Confirm-Export $candidate
              if ($final.status -eq 'PASS' -and $exportCode -ne 0) { throw 'Exporter did not confirm success' }
              $upload = $candidate
            }
          } catch { $exportCode = 1; $upload = $null }
          if ($null -eq $upload) {
            Assert-RealDirectory $env:RUNNER_TEMP
            $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
            if ($temp -ieq [IO.Path]::GetPathRoot($temp).TrimEnd('\') -or $temp -ieq $workspace -or $temp.StartsWith($workspace + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected fallback parent' }
            if ($env:GITHUB_RUN_ID -notmatch '^[0-9]+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'Invalid run identity' }
            $upload = Join-Path $env:RUNNER_TEMP ("w23-fallback-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $upload -ErrorAction Stop | Out-Null
            Assert-RealDirectory $upload
            $mode = if ($env:W23_DIAG_MODE -in @('r01','r02')) { $env:W23_DIAG_MODE } else { 'UNKNOWN' }
            $summary = @{status='UNKNOWN'; completed=$false; mode=$mode; reason='Diagnostic/export did not complete'; w23='BLOCKED'}
            $summary | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $upload 'summary.json') -Encoding utf8
            $hash = (Get-FileHash -LiteralPath (Join-Path $upload 'summary.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            @{'summary.json'=$hash} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $upload 'SHA256.json') -Encoding utf8
            $final = Confirm-Export $upload
            $exportCode = 1
          }
          "## W23 diagnostic: $($final.status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "W23 remains BLOCKED; this run does not authorize acceptance or authority activation." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "upload=$upload" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($exportCode -ne 0) { exit 1 }


      - name: Upload only redacted diagnostic evidence
        if: always() && steps.finalize.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: w23-${{ inputs.diagnostic_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.finalize.outputs.upload }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          compression-level: 6

  # Dispatch mode isolation: normal -> W18, r01/r02 -> existing W23 diagnostics,
  # focused -> this job only. Push events can never start the focused job.
  focused-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode != '' && (inputs.diagnostic_mode == 'focused' || (inputs.diagnostic_mode != 'normal' && inputs.diagnostic_mode != 'r01' && inputs.diagnostic_mode != 'r02')) }}
    name: W23 focused validation (${{ matrix.scope }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10.11'
            scope: py310
          - python-version: '3.12.10'
            scope: py312
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      W23_FOCUSED_MODE: ${{ inputs.diagnostic_mode }}
      W23_FOCUSED_REVIEWED_SHA: ${{ inputs.diagnostic_revision }}
      W23_FOCUSED_SCOPE: ${{ matrix.scope }}
      W23_FOCUSED_PYTHON: ${{ matrix.python-version }}
      W23_FOCUSED_EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
    steps:
      - name: Reject unexpected dispatch parameters before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'focused validation is dispatch-only' }
          if ($env:W23_FOCUSED_MODE -cne 'focused') { throw 'unexpected diagnostic mode' }
          if ($env:GITHUB_REF -cne 'refs/heads/diagnostic/w23-r4-focused-postflight') { throw 'unexpected diagnostic ref' }
          if ($env:W23_FOCUSED_REVIEWED_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:W23_FOCUSED_REVIEWED_SHA -cne $env:GITHUB_SHA) { throw 'reviewed SHA must exactly match GITHUB_SHA' }
          $eventInputs = $env:W23_FOCUSED_EVENT_INPUTS | ConvertFrom-Json
          $allowed = @('diagnostic_mode', 'diagnostic_revision', 'diagnostic_unit_tests')
          $unexpected = @($eventInputs.PSObject.Properties.Name | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw 'unexpected workflow_dispatch input names' }
          if ($eventInputs.diagnostic_mode -cne 'focused') { throw 'event payload mode mismatch' }
          if ($eventInputs.diagnostic_revision -cne $env:GITHUB_SHA) { throw 'event payload SHA mismatch' }
          if ($eventInputs.diagnostic_unit_tests -in @($true, 'true', 'True')) { throw 'optional broad diagnostic tests are forbidden in focused mode' }

      - name: Checkout the exact reviewed ref
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the exact Python cell without pip cache
        id: setup_python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Verify immutable source identity and clean checkout before tests
        id: preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:GIT_OPTIONAL_LOCKS = '0'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:W23_FOCUSED_REVIEWED_SHA) { throw 'checkout commit differs from reviewed SHA' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cnotmatch '^[a-f0-9]{40}$') { throw 'invalid checkout tree' }
          $parents = @(git rev-list --parents -n 1 HEAD)
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 1 -or $parents[0].Split(' ')[0] -cne $head) { throw 'invalid checkout lineage' }
          $parentParts = $parents[0].Split(' ')
          [string[]]$parentIds = @()
          if ($parentParts.Count -gt 1) { $parentIds = [string[]]($parentParts | Select-Object -Skip 1) }
          $dirty = @(git status --porcelain=v1 --untracked-files=all --ignored=matching --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'checkout is not clean, including ignored paths' }
          git fsck --full --no-reflogs --no-progress | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Git object validation failed' }
          python -B scripts/w23_ci_identity.py before
          if ($LASTEXITCODE -ne 0) { throw 'tracked source identity preflight failed' }
          $out = Join-Path $env:RUNNER_TEMP 'w23-focused'
          New-Item -ItemType Directory -Path (Join-Path $out 'raw') -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $out 'sanitized') -ErrorAction Stop | Out-Null
          $identity = [ordered]@{commit=$head; tree=$tree; parents=$parentIds; python=$env:W23_FOCUSED_PYTHON; scope=$env:W23_FOCUSED_SCOPE}
          $identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out 'identity-before.json') -Encoding utf8
          "W23_FOCUSED_OUTPUT=$out" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Install hash-pinned test dependencies in bounded scratch
        id: dependencies
        if: ${{ always() && steps.setup_python.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w23-focused-bootstrap-pip -CommandTimeoutSeconds 120 -ChildArguments @('-m','pip','install','--isolated','--no-input','--disable-pip-version-check','--no-cache-dir','--require-hashes','--only-binary=:all:','--no-deps','--requirement','distribution/bootstrap-pip.lock')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w23-focused-requirements -CommandTimeoutSeconds 180 -ChildArguments @('-m','pip','install','--isolated','--no-input','--disable-pip-version-check','--no-cache-dir','--require-hashes','--only-binary=:all:','--requirement','requirements-ci.lock')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python 3.10 naming hygiene scanner
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.preflight.outcome == 'success' && matrix.scope == 'py310' }}
        shell: pwsh
        run: |
          ./scripts/w23_ci_windows.ps1 -Gate command -Name w23-focused-naming -CommandTimeoutSeconds 45 -ChildArguments @('scripts/check_production_naming_hygiene.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python 3.10 naming, postflight, and historical H tests
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.preflight.outcome == 'success' && matrix.scope == 'py310' }}
        shell: pwsh
        run: |
          $junit = Join-Path (Join-Path $env:W23_FOCUSED_OUTPUT 'raw') 'py310-entry-h.xml'
