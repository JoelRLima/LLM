name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core and development dependencies
        run: python -m pip install --constraint requirements-ci.lock -r requirements-dev.txt

      - name: Installed entry point smoke test
        run: python -c "from agent.interfaces.cli import main; assert callable(main)"

      - name: Ruff
        run: ruff check .

      - name: Repository quality policy
        run: python scripts/check_quality.py

      - name: Mypy
        run: |
          mypy --platform linux
          mypy --platform win32

      - name: POSIX shell lifecycle
        if: runner.os == 'Linux'
        run: >
          pytest -q
          "tests/unit/skills/test_shell.py::test_posix_shell_process_terminates_parent_and_descendant[timeout-timed_out]"
          "tests/unit/skills/test_shell.py::test_posix_shell_process_terminates_parent_and_descendant[cancel-cancelled]"
          tests/unit/skills/test_shell.py::test_posix_shell_parent_exit_terminates_descendant_with_inherited_pipes

      - name: Pytest
        env:
          AGENT_RUNTIME_DIR: ${{ runner.temp }}/llm-agent-runtime
        run: pytest -q --junitxml=pytest-results.xml

      - name: Diagnose Pytest failures
        if: failure()
        run: python scripts/report_pytest_failures.py pytest-results.xml

      - name: Installed wheel acceptance gate
        run: python scripts/verify_installed_package.py
