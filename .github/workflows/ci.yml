name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, "feat/wave23-structural-consolidation"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core and development dependencies
        run: python -m pip install --constraint requirements-ci.lock -r requirements-dev.txt

      - name: Authenticate tracked source before acceptance
        run: python -B scripts/w23_ci_identity.py before

      - name: Installed entry point smoke test
        run: python -c "from llm_agent.interfaces.cli import main; assert callable(main)"

      - name: Ruff
        run: ruff check .

      - name: Repository quality policy
        run: python scripts/check_quality.py

      - name: Mypy
        run: |
          mypy --platform linux
          mypy --platform win32

      - name: POSIX shell lifecycle in bounded disposable scope
        if: runner.os == 'Linux'
        run: bash scripts/w23_ci_linux.sh lifecycle

      - name: Full Pytest Linux
        if: runner.os == 'Linux'
        run: bash scripts/w23_ci_linux.sh pytest

      - name: Full Pytest Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/w23_ci_windows.ps1 -Gate pytest

      - name: Diagnose Pytest failures
        if: failure()
        run: python scripts/report_pytest_failures.py "${{ runner.temp }}/w23-evidence/pytest.xml"

      - name: Installed wheel acceptance Linux
        if: runner.os == 'Linux'
        run: bash scripts/w23_ci_linux.sh installed

      - name: Installed wheel acceptance Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/w23_ci_windows.ps1 -Gate installed

      - name: Verify tracked source after acceptance
        if: always()
        run: python -B scripts/w23_ci_identity.py after

      - name: Preserve bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w23-acceptance-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/w23-evidence/
          if-no-files-found: error
